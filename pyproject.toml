[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "support-evidence"
version = "0.1.0"
description = "Local, evidence-scoped operational diagnosis over existing monitoring"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23,<5"]

[project.optional-dependencies]
databases = ["pymongo>=4.10,<5", "psycopg[binary]>=3.2,<4"]
dev = ["pytest>=8,<10", "build>=1,<2"]

[project.scripts]
support-evidence = "support_evidence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
support_evidence = ["packages/*.json", "schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
